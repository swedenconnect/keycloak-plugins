# SwedenconnectDS login theme.
#
# Extends the stock keycloak.v2 login theme. Only what differs is overridden here:
#   login.ftl                        identity-provider selection list only; there is no username/password form
#   resources/css/swedenconnect-ds.css  colours, typeface and button shapes, matching SwedenconnectIdpPsw
parent=keycloak.v2

# The sandbox site has no dark variant, so the theme does not follow the browser's colour scheme.
darkMode=false

# css/styles.css is inherited from the parent theme and must stay first.
styles=css/styles.css css/swedenconnect-ds.css
