# DiggDSPsw login theme.
#
# Extends the stock keycloak.v2 login theme. Only what differs is overridden here:
#   login.ftl                      identity providers first, username/password behind a toggle card
#   resources/css/digg-ds-psw.css  DIGG discovery-service colours and layout, with a password toggle
parent=keycloak.v2

# The discovery service this theme follows has no dark variant.
darkMode=false

# css/styles.css is inherited from the parent theme and must stay first.
styles=css/styles.css css/digg-ds-psw.css
