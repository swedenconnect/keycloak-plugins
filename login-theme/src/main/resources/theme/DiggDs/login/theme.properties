# DiggDs login theme.
#
# Extends the stock keycloak.v2 login theme. Only what differs is overridden here:
#   login.ftl                  identity-provider selection list only; there is no username/password form
#   resources/css/digg-ds.css  colours and layout taken from DIGG's discovery service (iam.digg.se/ds)
parent=keycloak.v2

# The discovery service this theme follows has no dark variant.
darkMode=false

# css/styles.css is inherited from the parent theme and must stay first.
styles=css/styles.css css/digg-ds.css
