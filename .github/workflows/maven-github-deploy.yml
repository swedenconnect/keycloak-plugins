# Publishes the release artifacts to the GitHub Packages Maven registry of this repository when a
# version tag is pushed.
#
# It runs alongside the GitHub release workflow, which reacts to the same tags, and does not depend
# on it. The deploy uses the "release" profile of the parent POM, the same one used for a deploy from
# a developer machine. Every module of the build is published, except those that set
# the skipPublishing property (tools and integration-tests).
#
# It can also be started by hand with a tag as input. It then checks out that tag and does exactly
# what a pushed tag does.
#
# A published version should never be replaced, so the tag and the version in the POMs are checked
# before anything is built. If that check fails nothing is published.
name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to publish, for example v0.7.2'
        required: true
        type: string

# Nothing by default. The deploy job asks for what it needs.
permissions: {}

jobs:
  deploy:
    name: Deploy to GitHub Packages
    runs-on: ubuntu-latest

    # Reading the repository, and publishing packages for this repository with the token GitHub
    # gives the workflow. Every dependency comes from Maven Central.
    permissions:
      contents: read
      packages: write

    env:
      # The tag that started the workflow, or the one given when started by hand.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      # The ref is given in full, so a branch of the same name as the tag is never checked out.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # The settings.xml that setup-java writes is replaced here, so the server is stated where it is
      # used. The values are environment references, so no secret is written to the file or shown in
      # the log. GITHUB_ACTOR is set by GitHub on every run.
      - name: Configure the Maven servers
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      # Nothing has been built at this point, so a tag that does not match publishes nothing. Every
      # module of the default reactor where skipPublishing is not true must be at the version the
      # tag names, and that version must not be a snapshot.
      - name: Check that the tag matches the Maven version of every published module
        run: |
          if [[ "${TAG}" != v* ]]; then
            echo "::error::The tag ${TAG} does not start with 'v'"
            exit 1
          fi
          EXPECTED="${TAG#v}"
          MODULES=". $(mvn -q --no-transfer-progress help:evaluate -Dexpression=project.modules -DforceStdout \
            | sed -n 's|.*<string>\(.*\)</string>.*|\1|p' | tr '\n' ' ')"
          errors=0
          for module in ${MODULES}; do
            VERSION=$(mvn -q --no-transfer-progress -N -f "${module}/pom.xml" help:evaluate \
              -Dexpression=project.version -DforceStdout)
            SKIP=$(mvn -q --no-transfer-progress -N -f "${module}/pom.xml" help:evaluate \
              -Dexpression=skipPublishing -DforceStdout || true)
            if [[ "${SKIP}" == "true" ]]; then
              echo "  ${module}: ${VERSION} - not published, not checked"
            elif [[ "${VERSION}" == *-SNAPSHOT ]]; then
              echo "::error::The version of ${module} is the snapshot ${VERSION}"
              errors=$((errors + 1))
            elif [[ "${VERSION}" != "${EXPECTED}" ]]; then
              echo "::error::The version of ${module} is ${VERSION}, but the tag ${TAG} requires ${EXPECTED}"
              errors=$((errors + 1))
            else
              echo "  ${module}: ${VERSION} - ok"
            fi
          done
          if [[ "${errors}" -gt 0 ]]; then
            echo "::error::${errors} module(s) do not match the tag ${TAG} - nothing has been published"
            exit 1
          fi

      # A full build and then the deploy. The tests are not run, since the maintainer has run them,
      # integration tests included, before the tag was pushed (see docs/releasing.md). Signing uses
      # the Bouncy Castle signer of the Maven GPG plugin, which takes the key and its passphrase from
      # the environment, so the runner needs no gpg executable and no key import. Selecting it on the
      # command line leaves the release profile usable as it is from a developer machine.
      - name: Build and deploy to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.BOT_GPG_PASSWORD }}
        run: mvn -Prelease clean deploy -DskipTests -Dgpg.signer=bc --no-transfer-progress
